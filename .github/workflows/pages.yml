name: Public controller and latest firmware
on:
  # Stage only published artifacts. A source push before the release is public
  # would deploy an older BIN under the same source SHA as the release event.
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate controller
        run: python tools/sync-web-pages.py
      - name: Stage public files and verified release
        run: |
          mkdir -p _site/firmware
          cp web/hosted.html _site/index.html
          cp -r web/fonts _site/fonts
          python tools/stage-public-release.py --repo "${{ github.repository }}" --tag "${{ github.event.release.tag_name }}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
