name: Public controller and latest firmware
on:
  # Stage only published artifacts. A source push before the release is public
  # would deploy an older BIN under the same source SHA as the release event.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to deploy (for example v20261121.10)
        required: false
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install page build tools
        run: npm --prefix tools ci --no-audit --no-fund
      - name: Generate controller
        run: python tools/sync-web-pages.py
      - name: Stage public files and verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          mkdir -p _site/firmware
          cp web/hosted.html _site/index.html
          cp -r web/fonts _site/fonts
          python tools/stage-public-release.py --repo "${{ github.repository }}" --tag "$RELEASE_TAG"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
