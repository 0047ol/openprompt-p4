<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>真机屏幕 · 全场景 Demo</title>
<style>
@font-face{font-family:DeviceReader;src:url('reader.woff2') format('woff2');font-display:swap}
:root{color-scheme:dark;--surface:#11191e;--line:#293a44;--text:#eaf0f1;--muted:#aab8c0;--accent:#8fcee9}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#0b1014;color:var(--text);font:14px/1.5 system-ui,sans-serif}.workspace{max-width:1440px;margin:auto;padding:24px}.tools,.options{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px}.heading{display:flex;gap:12px;align-items:center;margin-bottom:18px}.heading h1{font-size:20px;margin:0}.heading a{font-size:24px;line-height:1;text-decoration:none;padding:8px}.tools label,.options label{display:flex;gap:8px;align-items:center;color:var(--muted)}select,button,input[type=number]{min-height:38px;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit}button{cursor:pointer}button:active{filter:brightness(.8)}button:disabled{opacity:.5;cursor:default}select:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}input[type=number]{width:80px}input[type=range]{width:160px;accent-color:var(--accent)}input[type=checkbox]{accent-color:var(--accent)}.progress-control output{min-width:4ch}.status{display:flex;flex-wrap:wrap;gap:12px;align-items:center;color:var(--muted);margin:0 0 14px}.status p{margin:0}.status button{margin-left:auto}
.screen-wrap{position:relative;margin:auto;overflow:hidden;background:#000;border:1px solid #293239;border-radius:12px;box-shadow:0 20px 60px #0005}.screen{position:relative;width:1280px;height:800px;background:#000;font-family:DeviceReader,sans-serif;transform-origin:top left;overflow:hidden}.screen.portrait{width:800px;height:1280px}.scene{position:absolute;inset:0}.screen-header{position:absolute;top:0;left:16px;right:16px;height:72px;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;font-size:22px;color:#8aa4b8;line-height:1.45}.screen-header .brand{text-align:center;color:#cbef9c;font-size:30px}.screen-header .state{text-align:right}
.guide-card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:1160px;padding:32px;background:var(--surface);border:1px solid var(--line);border-radius:20px}.steps{display:flex;align-items:center;height:60px;margin-bottom:28px}.step{width:50%;display:flex;justify-content:center;align-items:center;gap:10px;font-size:22px;color:#798c98}.number{width:38px;height:38px;flex:none;border-radius:50%;background:#1b262d;display:grid;place-items:center}.step.active{color:var(--text)}.step.active .number{background:#243f50;color:#a1d9f6}.content{display:flex;align-items:center;justify-content:center;gap:40px}.qr-frame{width:328px;height:328px;padding:16px;flex:none;background:#fff;border-radius:12px}.qr-frame img{width:296px;height:296px;display:block}.copy{flex:1;min-width:0;display:flex;flex-direction:column;gap:18px}.copy>*{margin:0;overflow-wrap:anywhere}.copy.enter{animation:enter .16s ease-out}.eyebrow{font-size:22px;color:var(--accent)}.copy h2{font-size:32px;font-weight:400;color:var(--text);line-height:1.5}.description{font-size:24px;color:var(--muted);line-height:1.5}.network,.address{font-size:22px;color:var(--muted);line-height:1.5;white-space:pre-line}.screen.portrait .guide-card{width:720px;padding:28px}.screen.portrait .content{flex-direction:column;gap:28px}.screen.portrait .copy{width:100%;gap:16px;text-align:center}
canvas{width:100%;height:100%;display:block}.system-scene{background:#0b1118}.system-content{position:absolute;width:var(--content-width);height:var(--content-height);left:50%;top:50%;transform:translate(-50%,-50%)}.system-motion{position:absolute;inset:0}.system-title,.system-detail,.system-hint,.system-percent{position:absolute;left:0;right:0;transform:translateY(-50%);text-align:center;line-height:1.45;margin:0;font-weight:400}.system-title{top:calc(50% + var(--title-y));font-size:var(--title-font);color:#f3f6fa}.system-detail,.system-hint{top:calc(50% + var(--detail-y));font-size:var(--detail-font);color:#8aa4b8}.system-progress{position:absolute;width:78%;left:11%;top:calc(50% + var(--progress-y));transform:translateY(-50%);height:8px;background:#263442;border-radius:5px;overflow:hidden}.system-progress span{display:block;height:100%;background:#cbef9c}.system-percent{top:calc(50% + var(--percent-y));font-size:var(--detail-font);color:#cbef9c}.startup .system-percent{color:#8aa4b8}.system-icon{position:absolute;left:50%;top:calc(50% + var(--icon-y));width:var(--icon-size);height:var(--icon-size);transform:translate(-50%,-50%);color:#8fcee9}.system-icon svg{display:block;width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;transform-origin:50% 50%}.system-icon .track{stroke:#263442}.motion-on .system-scene:not([hidden]) .system-icon .rotor{animation:spin var(--spin-ms) linear infinite;transform-origin:center}.motion-on .scene:not([hidden]) .waiting{animation:pulse var(--pulse-ms) ease-in-out infinite alternate}@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}@keyframes pulse{from{opacity:.333}to{opacity:1}}
.note{color:#82959f;margin:16px 0 0;font-size:13px}a{color:var(--accent)}.catalog{margin-top:24px;border-top:1px solid var(--line);padding-top:16px;color:var(--muted)}.catalog p{margin:6px 0}.catalog a{margin-right:16px}.loading-note{position:absolute;inset:0;display:grid;place-items:center;background:#000;color:#aab8c0;font-size:28px}@keyframes enter{from{opacity:0}to{opacity:1}}@media(prefers-reduced-motion:reduce){.copy.enter{animation:none}}@media(max-width:650px){.workspace{padding:16px}.tools label{flex:1}.tools select{max-width:100%;min-width:0;flex:1}.tools label:first-child{flex-basis:100%}.status{font-size:12px}.screen-wrap{border-radius:8px}.heading h1{font-size:18px}.options{gap:10px}.options label{font-size:13px}input[type=range]{width:115px}}
/* Keep a shared control row so changing scenes cannot resize the device. */
.system-status{position:absolute;left:0;right:0;top:calc(50% + var(--title-y));transform:translateY(-50%);display:flex;align-items:center;justify-content:center;gap:var(--icon-gap)}.system-status .system-icon{position:static;transform:none;flex:none}.system-status .system-title{position:static;transform:none;max-width:calc(100% - var(--icon-size) - var(--icon-gap))}
.guide-card{height:var(--guide-landscape-height);display:flex;flex-direction:column}.steps{flex:none}.content{flex:1;min-height:0}.copy{justify-content:center}.screen.portrait .guide-card{height:var(--guide-portrait-height)}
.content{width:max-content;max-width:var(--guide-content-width);align-self:center;gap:var(--guide-column-gap)}.qr-frame{width:var(--guide-qr-size);height:var(--guide-qr-size);padding:var(--guide-qr-padding);border-radius:10px}.qr-frame img{width:100%;height:100%}.copy{position:relative;flex:0 1 auto;width:max-content;max-width:calc(var(--guide-content-width) - var(--guide-qr-size) - var(--guide-column-gap));display:flex;flex-direction:column;justify-content:center;gap:var(--guide-title-gap)}.copy>*{position:static}.guide-title-row{display:flex;align-items:center;gap:14px}.guide-title-row h2{margin:0;line-height:var(--guide-title-line-height)}.description{display:flex;flex-direction:column;gap:var(--guide-paragraph-gap);line-height:var(--guide-body-line-height);white-space:normal}.description>span{display:block;white-space:pre-line}.guide-success{width:32px;height:32px;flex:none;color:#cbef9c}.guide-success svg{display:block;width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.guide-loader{width:32px;height:32px;flex:none;color:var(--accent)}.guide-loader svg{display:block;width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round}.guide-loader .track{stroke:#293a44}.motion-on .guide-scene:not([hidden]) .guide-loader:not([hidden]) svg{animation:spin var(--spin-ms) linear infinite;transform-origin:center}.content.centered{width:100%}.content.centered .copy{text-align:center;max-width:100%}.content.centered .guide-title-row{justify-content:center}.screen.portrait .copy{flex:none;width:max-content;max-width:100%;gap:var(--guide-title-gap)}.screen.portrait .guide-title-row{justify-content:center}.screen.portrait .content{width:100%;gap:28px}
html{scrollbar-gutter:stable}.scenario-options{display:grid}.scenario-options>.options{grid-area:1/1;align-self:start;min-width:0}.scenario-options>.options[hidden]{display:flex!important;visibility:hidden;pointer-events:none}.status{margin:16px 0 0}
.tools label:has(input[type=checkbox]),.options label{flex:0 0 auto;white-space:nowrap}
</style></head><body><main class="workspace">
<div class="heading"><a href="/" aria-label="返回 Demo 目录" title="返回 Demo 目录">‹</a><h1>真机屏幕 · 全场景 Demo</h1></div>
<div class="tools"><label>场景<select id="scenario">
<optgroup label="待机与连接引导"><option value="JOIN">1 · 连接热点</option><option value="WIFI_CONNECTING">Wi-Fi 连接中</option><option value="WIFI_FAILED">Wi-Fi 连接失败</option><option value="LAN">2 · 局域网控制</option><option value="BLUETOOTH">2 · 蓝牙控制</option><option value="READY">3 · 待机／开始使用</option></optgroup>
<optgroup label="提词与休眠"><option value="PLAYING">正在播放</option><option value="PAGE_PLAYING">整页提词 · 自动翻页</option><option value="PAGE_PAUSED">整页提词 · 已暂停</option><option value="PAUSED">已暂停</option><option value="STOPPED">已停止 · 回到开头</option><option value="FINISHED">播放结束 · 回到开头</option><option value="COUNTDOWN">播放倒计时</option><option value="SLEEP_PENDING">即将休眠 · 变暗</option><option value="ASLEEP">已经休眠 · 黑屏</option></optgroup>
<optgroup label="启动与固件更新"><option value="STARTUP">开机进度</option><option value="CRASH_RECOVERY">异常重启恢复提示</option><option value="POWER_ON">网页开机进度</option><option value="SHUTDOWN">正在关机</option><option value="OFF">已经关机 · 黑屏</option><option value="RESTART">正在重启</option><option value="FACTORY_RESET">恢复出厂设置</option><option value="UPDATE_CHECKING">升级 · 检查 SD 卡</option><option value="UPDATE_WRITING">升级 · 写入固件</option><option value="UPDATE_RESTART">升级 · 校验完成</option></optgroup>
</select></label><label>方向<select id="orientation"><option value="landscape">横屏</option><option value="portrait">竖屏</option></select></label><label>语言<select id="language"><option value="0">中文</option><option value="1">English</option></select></label><label><input type="checkbox" id="clockSynced" checked>已获取时间</label><label><input type="checkbox" id="motion" checked>界面动效</label><button id="animate" type="button" aria-pressed="false">自动演示</button><button id="replay" type="button">重看动效</button><button id="advance" type="button">下一场景 →</button></div>
<div class="scenario-options">
<div class="options" id="readingOptions" hidden><label>字号<input id="font" type="number" min="40" max="180" step="10" value="90"></label><label>速度<input id="speed" type="range" min="20" max="200" value="100"><output id="speedValue">100</output></label><label><input id="mirror" type="checkbox">屏幕镜像</label><label><input id="sight" type="checkbox" checked>视线框</label><label><input id="highlight" type="checkbox" checked>中心高亮</label><button id="rewind" type="button">回到开头</button></div>
<div class="options" id="progressOptions" hidden><label class="progress-control">进度<input id="progress" type="range" min="0" max="100" value="55"><output id="progressValue">55%</output></label></div><div class="options" id="reconnectOptions" hidden><label><span id="connectionModeLabel">控制方式</span><select id="reconnectVia"><option value="lan">路由器 Wi-Fi</option><option value="hotspot">设备热点</option><option value="bluetooth">蓝牙</option></select></label></div>
</div>
<details id="barDemoSettings" style="margin:0 0 16px"><summary style="cursor:pointer">标题栏与状态栏预览设置</summary><div class="options" style="margin-top:12px"><label><input id="demoShowHeader" type="checkbox" checked>标题栏</label><label><input id="demoShowFooter" type="checkbox" checked>状态栏</label><label>标题栏高度<input id="demoHeaderHeight" type="number" min="24" max="160" step="4" value="72"></label><label>状态栏高度<input id="demoFooterHeight" type="number" min="24" max="160" step="4" value="72"></label><label>标题栏字号<input id="demoHeaderFont" type="number" min="12" max="40" value="22"></label><label>状态栏字号<input id="demoFooterFont" type="number" min="12" max="40" value="22"></label><label>播放方式<select id="demoPlaybackMode"><option value="none">单篇</option><option value="loop">自动循环</option><option value="next">自动下一篇</option></select></label></div><div id="barDemoFields" class="options"></div><p id="barCapacity" class="note" aria-live="polite"></p></details>
<div class="screen-wrap" id="screenWrap"><div class="screen" id="screen"><div class="scene guide-scene" id="guideScene"><header class="screen-header"><div id="screenClock"></div><div class="brand" id="brand">提词器</div><div class="state" id="state">待连接</div></header><section class="guide-card" aria-label="连接引导"><div class="steps" id="steps"></div><div class="content" id="guideContent"><div class="qr-frame" id="qrFrame"><img id="qr" alt="示例二维码"></div><div class="copy" id="copy"><div class="guide-title-row"><span class="guide-loader" id="guideLoader" hidden aria-hidden="true"><svg viewBox="0 0 44 44"><circle class="track" cx="22" cy="22" r="20"/><path d="M22 2a20 20 0 0 1 20 20"/></svg></span><h2 id="title"></h2></div><p class="description" id="description"></p></div></div></section></div>
<div class="scene" id="readingScene" hidden><canvas id="readerCanvas" width="1280" height="800"></canvas><div class="loading-note" id="fontLoading">正在加载本地演示字体…</div></div>
<div class="scene system-scene" id="systemScene" hidden><div class="system-content"><div class="system-motion" id="systemMotion"><div class="system-status" id="systemStatus"><div class="system-icon" id="systemIcon" aria-hidden="true"><svg class="rotor" viewBox="0 0 44 44"><circle class="track" cx="22" cy="22" r="20"/><path class="loading-arc" d="M22 2a20 20 0 0 1 20 20"/></svg></div><h2 class="system-title" id="systemTitle"></h2></div><div class="system-detail" id="systemDetail"></div><div class="system-hint" id="systemHint"></div><div class="system-progress" id="systemProgress"><span id="systemFill"></span></div><div class="system-percent" id="systemPercent"></div></div></div></div></div></div>
<div class="status"><p id="sceneNote">虚拟状态演示，不连接真实设备。扫码内容为示例。</p></div>
<p class="note">按真机 1280 × 800 / 800 × 1280 比例缩放。播放复用控制台的绘制代码，连接文案与固件共用；字体全部从本地加载。这里不验证屏幕驱动、真实帧率或连接能力。</p><nav class="catalog" aria-label="其他 Demo"><p>网页界面也可直接操作，修改的是临时虚拟数据：</p><a href="/console.html">稿件库 / 播放 / 编辑 / 设置</a><a href="/">全部 Demo 目录</a></nav>
</main><script>const guide=/* GUIDE_COPY */;const motionSettings=/* MOTION_SETTINGS */;const systemSettings=/* SYSTEM_SETTINGS */;</script><script src="device-renderer.js"></script><script src="device.js"></script></body></html>
